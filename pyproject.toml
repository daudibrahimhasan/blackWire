[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blackwire"
version = "0.1.0"
description = "A live terminal backchannel for independent AI coding agents."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["ai", "cli", "terminal", "agents", "mcp", "codex", "claude", "gemini"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Application Frameworks"
]

[project.scripts]
blackwire = "blackwire_launcher:main"
blackwire-mcp = "blackwire_launcher:main_mcp"

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]
exclude = ["tests*"]

[tool.setuptools.package-data]
blackwire_launcher = ["vendor/*.mjs"]
